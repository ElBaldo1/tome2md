[project]
name = "tome2md"
version = "0.1.0"
description = "Convert PDF, EPUB, DOCX, MOBI/AZW3, ODT, RTF, HTML, FB2, TXT and Markdown books into a chapter-split, Obsidian-ready Markdown vault — fully local, no cloud, no API key."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Antonio Baldari" }]
keywords = [
  "markdown",
  "obsidian",
  "epub",
  "pdf",
  "mobi",
  "ebook",
  "knowledge-base",
  "rag",
  "pkm",
  "converter",
  "ocr",
  "pandoc",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Text Processing :: Markup :: Markdown",
  "Topic :: Utilities",
]
dependencies = [
  "pymupdf>=1.24",
  "pillow>=10.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10"]
docling = ["docling>=1.0"]
all = ["pytesseract>=0.3.10", "docling>=1.0"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/ElBaldo1/tome2md"
Issues = "https://github.com/ElBaldo1/tome2md/issues"

[project.scripts]
tome2md = "tome2md.converter:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tome2md"]
